<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JK's Fruit Soda</title>
    <link rel="stylesheet" href="admin-styles.css">
    <style>
        .admin-locked {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .admin-locked.hidden { display: none; }
        .locked-message {
            background: white; padding: 3rem; border-radius: 15px;
            text-align: center; max-width: 500px;
        }
        .password-modal {
            background: white; padding: 2rem; border-radius: 15px;
            text-align: center; max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* STAR RATING FIX */
        .star-rating-group {
            display: flex;
            gap: 10px;
            margin: 1rem 0;
        }
        .star-rating-group input {
            display: none;
        }
        .star-rating-group label {
            font-size: 2.5rem;
            cursor: pointer;
            color: #ddd;
            transition: color 0.2s ease;
        }
        .star-rating-group input:checked ~ label,
        .star-rating-group label:hover,
        .star-rating-group label:hover ~ label {
            color: #ffc107;
        }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 0.75rem; border: 2px solid #ddd;
            border-radius: 8px; font-size: 1rem; font-family: inherit;
            box-sizing: border-box;
        }

        .btn-submit {
            background: linear-gradient(135deg, #0066ff, #0052cc);
            color: white; border: none; padding: 0.75rem 2rem;
            border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; width: 100%;
        }

        .section-card {
            background: white; padding: 2rem; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Password Lock Modal -->
    <div id="passwordLock" class="admin-locked">
        <div class="password-modal">
            <h2>🔐 Admin Access</h2>
            <p>Enter password</p>
            <input type="password" id="adminPassword" placeholder="Enter password">
            <button onclick="checkAdminPassword()">Access Admin</button>
        </div>
    </div>

    <!-- Admin Dashboard -->
    <div class="admin-container" id="adminContent" style="display: none;">
        <h1>🍓 JK's Admin Panel</h1>

        <!-- Upload Photos Tab -->
        <div class="section-card">
            <h2>📸 Add Customer Photo</h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label>Customer Name:</label>
                    <input type="text" id="customerName" required>
                </div>

                <div class="form-group">
                    <label>Photo:</label>
                    <input type="file" id="customerPhoto" accept="image/*" required>
                </div>

                <div class="form-group">
                    <label>Star Rating:</label>
                    <div class="star-rating-group">
                        <input type="radio" id="star1" name="rating" value="1">
                        <label for="star1">⭐</label>
                        <input type="radio" id="star2" name="rating" value="2">
                        <label for="star2">⭐</label>
                        <input type="radio" id="star3" name="rating" value="3">
                        <label for="star3">⭐</label>
                        <input type="radio" id="star4" name="rating" value="4">
                        <label for="star4">⭐</label>
                        <input type="radio" id="star5" name="rating" value="5" checked>
                        <label for="star5">⭐</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>Testimonial:</label>
                    <textarea id="customerTestimonial" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn-submit">✅ Upload Customer</button>
            </form>
        </div>

        <!-- Messages Section -->
        <div class="section-card" style="margin-top: 2rem;">
            <h2>📬 Messages</h2>
            <div id="messagesList"></div>
        </div>
    </div>

    <script>
        let ADMIN_PASSWORD = localStorage.getItem('jks_admin_password') || 'Jyair03062026!01';

        function checkAdminPassword() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('passwordLock').style.display = 'none';
                document.getElementById('adminContent').style.display = 'block';
            } else {
                alert('❌ Wrong password!');
            }
        }

        // PHOTO UPLOAD HANDLER
        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('customerName').value;
            const photo = document.getElementById('customerPhoto').files[0];
            const rating = document.querySelector('input[name="rating"]:checked').value;
            const testimonial = document.getElementById('customerTestimonial').value;

            const reader = new FileReader();
            reader.onload = function(e) {
                const customer = {
                    name: name,
                    photo: e.target.result,
                    rating: parseInt(rating),
                    testimonial: testimonial
                };

                let customers = JSON.parse(localStorage.getItem('jks_customers') || '[]');
                customers.push(customer);
                localStorage.setItem('jks_customers', JSON.stringify(customers));

                alert('✅ Customer added!');
                document.getElementById('uploadForm').reset();
            };
            reader.readAsDataURL(photo);
        });

        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem('jks_contact_messages') || '[]');
            const messagesList = document.getElementById('messagesList');

            if (messages.length === 0) {
                messagesList.innerHTML = '<p>No messages</p>';
                return;
            }

            messagesList.innerHTML = messages.map((msg, index) => `
                <div style="background: #f9f9f9; padding: 1rem; margin: 1rem 0; border-radius: 8px;">
                    <strong>${msg.name}</strong><br>
                    📧 ${msg.email}<br>
                    ${msg.message}
                    <button onclick="deleteMsg(${index})" style="background: #ff6b6b; color: white; border: none; padding: 0.5rem 1rem; border-radius: 5px; cursor: pointer; margin-top: 1rem;">🗑️ Delete</button>
                </div>
            `).join('');
        }

        function deleteMsg(index) {
            let messages = JSON.parse(localStorage.getItem('jks_contact_messages') || '[]');
            messages.splice(index, 1);
            localStorage.setItem('jks_contact_messages', JSON.stringify(messages));
            loadMessages();
        }

        loadMessages();
    </script>
</body>
</html>
